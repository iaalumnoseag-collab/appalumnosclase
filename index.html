<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buzón de Cupones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
/* Concepto: noche en píxel art (cielo azul-violeta-rosa con tramado, pinos verde azulado, nieve).
   Fondo animado que reacciona al puntero. Arriba el calendario, abajo la habitación del alumno. */
:root{
  --bg:#0a1440; --panel:#141c58; --panel2:#1f2468; --line:#6a45c2; --ink:#e6f6ff; --dim:#a3b2e6;
  --gold:#ffd166; --cyan:#6fe3d0; --pink:#ff5fa2; --green:#5fd68a; --red:#ff5a6a; --orange:#ffa04d;
  --deep:#0a1036; --shadow:#22104e;
  --f-title:'Press Start 2P','Courier New',monospace;
  --f-body:'VT323','Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
html,body{margin:0;color:var(--ink)}
body{background:transparent;font-family:var(--f-body);font-size:21px;line-height:1.25;padding-block:14px 40px;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
#bgfx{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;pointer-events:none;
  image-rendering:pixelated;image-rendering:crisp-edges}
#app{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px;position:relative;z-index:1}
h1,h2,h3,.h{font-family:var(--f-title);font-weight:400;line-height:1.55;margin:0}
h1{font-size:18px;color:var(--pink);text-shadow:3px 3px 0 var(--shadow)}
h2{font-size:12px;color:var(--cyan);text-shadow:2px 2px 0 var(--shadow)}
.h.sm{font-size:10px}
p{margin:0}
.dim{color:var(--dim)}
.center{text-align:center}
.warn{color:var(--orange)}
.px{image-rendering:pixelated;image-rendering:crisp-edges;width:32px;height:32px;flex:none}
.px.mini{width:16px;height:16px}
.px.av{width:48px;height:64px}
.px.avs{width:30px;height:40px}

.box{padding:14px;margin:4px;position:relative;
  background:linear-gradient(180deg,rgba(12,20,66,.9) 0 30%,rgba(20,24,86,.9) 30% 62%,rgba(34,26,100,.9) 62%);
  box-shadow:0 -4px 0 0 var(--line),0 4px 0 0 var(--line),-4px 0 0 0 var(--line),4px 0 0 0 var(--line),
    inset 0 3px 0 0 rgba(111,227,208,.18),inset 0 -3px 0 0 rgba(0,0,0,.25)}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}

.btn{--b:var(--gold);--bl:#ffe9a8;--bd:#c7902a;font-family:var(--f-title);font-size:10px;line-height:1.4;color:#1a0f3a;
  background:var(--b);border:0;padding:12px 14px;cursor:pointer;
  box-shadow:inset 3px 3px 0 var(--bl),inset -3px -3px 0 var(--bd),0 3px 0 0 var(--shadow)}
.btn:active{transform:translateY(2px);box-shadow:inset 3px 3px 0 var(--bl),inset -3px -3px 0 var(--bd)}
.btn.cy{--b:#6fe3d0;--bl:#c9f7ee;--bd:#23968a}
.btn.pk{--b:#ff5fa2;--bl:#ffb0cf;--bd:#b52d72;color:#fff}
.btn.gr{--b:#5fd68a;--bl:#b2f2c6;--bd:#2a9a5c}
.btn.rd{--b:#ff5a6a;--bl:#ffa0aa;--bd:#b52a3a;color:#fff}
.btn.gh{--b:rgba(10,16,54,.6);--bl:var(--line);--bd:var(--line);color:var(--ink)}
.btn.on{--b:#2a1f6e;--bl:var(--cyan);--bd:var(--cyan);color:var(--cyan)}
.btn.sm{font-size:8px;padding:9px 10px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.linkbtn{background:none;border:0;color:var(--cyan);font:inherit;text-decoration:underline;cursor:pointer;padding:6px}
:focus-visible{outline:3px dashed var(--cyan);outline-offset:2px}

label{display:flex;flex-direction:column;gap:6px;font-size:20px;color:var(--dim)}
input,select,textarea{font:inherit;font-size:21px;color:var(--ink);background:var(--deep);border:0;padding:9px 11px;width:100%;
  box-shadow:inset 0 0 0 3px var(--line);border-radius:0}
textarea{min-height:96px;resize:vertical}
input[type=date]{width:auto}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:12px}
.who .h{font-size:11px;color:var(--gold)}
.coins{display:flex;align-items:center;gap:4px;font-family:var(--f-title);font-size:11px}
.tag{font-family:var(--f-title);font-size:8px;padding:5px 7px;background:var(--panel2);color:var(--cyan)}
.tag.ok{background:#0f3d3a;color:var(--green)}
.pill{background:#4a1030;color:var(--red);font-family:var(--f-title);font-size:8px;padding:6px 8px}

.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calbody{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;margin-top:12px}
@media (max-width:680px){.calbody{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-family:var(--f-title);font-size:8px;color:var(--dim);text-align:center;padding:2px 0 4px}
.cell{min-height:44px;background:var(--panel2);border:0;color:var(--ink);font-family:var(--f-body);font-size:20px;
  position:relative;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px}
.cell.empty{background:transparent;cursor:default}
.cell.we{opacity:.35}
.cell.today{box-shadow:inset 0 0 0 3px var(--gold)}
.cell.sel{background:#3a2a86;box-shadow:inset 0 -3px 0 var(--pink)}
.cell.today.sel{box-shadow:inset 0 0 0 3px var(--gold)}
.cell .px{width:15px;height:15px}
.cell .dot{position:absolute;top:3px;right:3px;width:6px;height:6px;background:var(--pink)}
.day{background:var(--panel2);padding:12px;display:flex;flex-direction:column;gap:8px;align-content:start}
.day .when{font-family:var(--f-title);font-size:9px;color:var(--gold);text-transform:capitalize;line-height:1.7}
.tasks{white-space:pre-wrap;border-left:4px solid var(--pink);padding-left:10px}

.room-wrap{display:flex;flex-direction:column;gap:12px;padding:4px}
canvas#room{width:100%;height:auto;aspect-ratio:160/90;display:block;background:var(--deep);
  image-rendering:pixelated;image-rendering:crisp-edges;box-shadow:0 0 0 4px var(--line),0 0 0 8px var(--shadow)}
canvas#room.hot{cursor:pointer}
.menu{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.hint{text-align:center;color:var(--dim);font-size:19px;text-shadow:2px 2px 0 var(--shadow)}
.badge{display:inline-block;margin-left:6px;background:var(--deep);color:var(--gold);padding:2px 5px}
.frame{align-self:center;padding:10px;background:#c7902a;box-shadow:inset 3px 3px 0 #ffe9a8,inset -3px -3px 0 #7a4a12,0 4px 0 var(--shadow)}
.frame .mat{width:min(72vw,288px);aspect-ratio:4/3;background:var(--deep);display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 0 3px #7a4a12;text-align:center;padding:8px}
.frame img{width:100%;height:100%;display:block;object-fit:cover}
.roomframe{position:relative}
.roomframe .wallpic{position:absolute;left:calc(69 / 160 * 100%);top:calc(7 / 90 * 100%);width:calc(28 / 160 * 100%);height:calc(21 / 90 * 100%);
  object-fit:cover;pointer-events:none;box-shadow:inset 0 0 0 2px #0a1036}
.roomframe .wallpic[hidden]{display:none}
.editor{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:640px){.editor{grid-template-columns:1fr}}
.preview{background:var(--deep);padding:14px;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:inset 0 0 0 3px var(--line);position:sticky;top:10px}
.preview img{width:144px;height:192px;image-rendering:pixelated;image-rendering:crisp-edges}
.opt{display:flex;flex-direction:column;gap:8px}
.opt .lab{font-family:var(--f-title);font-size:8px;color:var(--cyan);line-height:1.6}
.sws{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;border:0;cursor:pointer;padding:0;box-shadow:inset 3px 3px 0 rgba(255,255,255,.3),inset -3px -3px 0 rgba(0,0,0,.3)}
.sw.on{outline:3px solid var(--gold);outline-offset:3px}
.thumbs{display:flex;flex-wrap:wrap;gap:6px}
.tb{background:var(--panel2);border:0;padding:5px 4px 3px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-family:var(--f-body);font-size:16px;color:var(--dim);box-shadow:inset 0 0 0 3px transparent;min-width:58px}
.tb.on{box-shadow:inset 0 0 0 3px var(--gold);color:var(--ink);background:#3a2a86}
.tb img{width:48px;height:64px;image-rendering:pixelated;image-rendering:crisp-edges}
.remix{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--deep);padding:12px;box-shadow:inset 0 0 0 3px var(--pink)}
.remix .h{font-size:9px;color:var(--pink)}
.eq{display:flex;gap:3px;align-items:flex-end;height:22px}
.eq i{width:5px;background:var(--cyan);display:block;animation:eq .5s steps(3) infinite alternate}
.eq i:nth-child(2){animation-delay:-.2s;background:var(--pink)} .eq i:nth-child(3){animation-delay:-.35s} .eq i:nth-child(4){animation-delay:-.1s;background:var(--gold)}
@keyframes eq{from{height:4px}to{height:22px}}
.thumb{width:36px;height:27px;image-rendering:pixelated;box-shadow:0 0 0 2px var(--gold)}

.drawer{display:flex;flex-direction:column;gap:12px}
.drawer[hidden]{display:none}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--panel2);padding:10px 12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.item.plain{display:flex;flex-direction:column;align-items:stretch;gap:8px}
.slots{display:flex;gap:10px}
.slot{width:64px;height:64px;background:var(--deep);box-shadow:inset 0 0 0 3px var(--line);display:flex;align-items:center;justify-content:center}
.slot .px{width:44px;height:44px}

.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.steps i{height:8px;background:var(--deep);display:block}
.steps i.f{background:var(--cyan)}
.st-redo .steps i.f{background:var(--orange)}
.st-done .steps i.f{background:var(--green)}
.stat{display:flex;align-items:center;gap:10px}
.stat .lbl{font-family:var(--f-title);font-size:10px;line-height:1.5}
.st-send .lbl{color:var(--cyan)} .st-seen .lbl{color:#fff} .st-work .lbl{color:var(--gold)}
.st-redo .lbl{color:var(--orange)} .st-done .lbl{color:var(--green)}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:.25}}
.st-send .px{animation:hop .8s steps(2) infinite}
.st-seen .px{animation:blink 1s steps(2) infinite}
.st-work .px{animation:spin 1.6s steps(8) infinite}
.st-redo .px{animation:spin 1.6s steps(8) infinite reverse}
.st-done .px{animation:hop .7s steps(2) infinite}

.rolls{display:flex;flex-direction:column;gap:8px}
.roll{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel2);padding:10px 12px}
.roll.on{background:#0f3d3a}
.right{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.req{background:var(--panel2);padding:12px;display:flex;flex-direction:column;gap:8px}
.req .desc{white-space:pre-wrap}
.stats{display:flex;flex-wrap:wrap;gap:16px;font-family:var(--f-title);font-size:9px;color:var(--dim)}
.stats b{color:var(--gold);font-weight:400}

.login{max-width:520px;margin:30px auto 0;display:flex;flex-direction:column;gap:16px;align-items:stretch}
.login .logo{display:flex;gap:10px;justify-content:center}
.login .logo .px{width:48px;height:48px}
.msg{min-height:24px;color:var(--orange);text-align:center}

.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(92vw,520px);
  background:var(--deep);color:var(--ink);padding:12px 16px;z-index:50;box-shadow:0 0 0 4px var(--cyan),0 0 0 8px var(--shadow)}
.toast.err{box-shadow:0 0 0 4px var(--red)}
.toast[hidden]{display:none}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<canvas id="bgfx" aria-hidden="true"></canvas>
<div id="app"></div>
<input type="file" id="photo-in" accept="image/*" hidden>
<input type="file" id="mp3-in" accept=".mp3,audio/mpeg,audio/mp3" hidden>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(() => {
'use strict';

/* ===== Configuración =====
   Para compartir datos entre todos los dispositivos, pega aquí la URL de tu Firebase Realtime Database
   (mira el archivo LEEME.md). Si lo dejas vacío, la app funciona en modo prueba, solo en este navegador. */
const CONFIG = { FIREBASE_URL: 'https://buzon-cupones-default-rtdb.europe-west1.firebasedatabase.app' };

const MAX_COUPONS = 2;
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const STATUS = [
  { k:'enviado',    label:'ENVIADO',      icon:'mail',  cls:'st-send', txt:'Tu petición viaja al buzón.' },
  { k:'recibido',   label:'RECIBIDO',     icon:'eye',   cls:'st-seen', txt:'El profe la ha visto.' },
  { k:'proceso',    label:'EN PROCESO',   icon:'gear',  cls:'st-work', txt:'Se está creando.' },
  { k:'rehaciendo', label:'REHACIÉNDOSE', icon:'gearo', cls:'st-redo', txt:'Ajustando y mejorando.' },
  { k:'entregado',  label:'ENTREGADO',    icon:'chest', cls:'st-done', txt:'¡Listo para ti!' }
];
const TYPES = ['Logotipo','Página web','Aplicación','Vídeo','Otro'];
const BGS = [['noche','Noche estrellada'],['lluvia','Lluvia'],['ciudad','Ciudad'],['atardecer','Atardecer'],['espacio','Espacio']];

/* ===== Utilidades ===== */
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const parseDay = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const longDate = s => parseDay(s).toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long' });
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
const mem = {};
const kv = {
  get(k){ try { const v = localStorage.getItem(k); return v === null ? (mem[k] ?? null) : v; } catch (e) { return mem[k] ?? null; } },
  set(k, v){ mem[k] = v; try { localStorage.setItem(k, v); } catch (e) {} },
  del(k){ delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} }
};
async function hashCode(s){
  const txt = 'buzon-cupones:' + s;
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    let h = 5381; for (const ch of txt) h = ((h << 5) + h + ch.charCodeAt(0)) >>> 0;
    return 'x' + h.toString(16);
  }
}
let toastTimer = null;
function toast(text, kind){
  const el = $('#toast'); el.textContent = text; el.className = 'toast' + (kind === 'err' ? ' err' : ''); el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 3800);
}
function speak(text){
  try {
    const u = new SpeechSynthesisUtterance(text); u.lang = 'es-ES'; u.rate = .95;
    const v = speechSynthesis.getVoices().find(v => /^es/i.test(v.lang)); if (v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}

/* ===== Píxel art: tramado (dithering) y colores ===== */
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + .5) / 16);
const hexRGB = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const u32 = ([r, g, b]) => ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0;
const mixRGB = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ===== Fondo animado: cielo nocturno que se mueve y reacciona al puntero ===== */
const Sky = (() => {
  const cv = $('#bgfx'), ctx = cv.getContext('2d');
  // Paletas del cielo, en bucle: rosa → verde → azul → rojo → amarillo → aurora → violeta → atardecer → hielo
  const PALS = [
    ['#081436','#0c1a4a','#12225e','#1a2a72','#253185','#343594','#4a379e','#6337a2','#7f35a0','#9d3398','#bd358d','#da4489','#ee6098','#f88bb4','#ffc0d6'],
    ['#03140a','#06200f','#0a2e16','#0e3d1d','#134d24','#195e2c','#207035','#28843e','#329848','#3fad52','#52c05e','#6cd170','#8fe08a','#b8eeaa','#e0f9d4'],
    ['#020822','#041034','#061a4a','#08245e','#0b3074','#0f3d8a','#144b9e','#1b5ab2','#256bc4','#327dd4','#4590e0','#5ea5ea','#7cbaf2','#a2d0f8','#cfe6fd'],
    ['#1a0306','#2a050a','#3c070e','#500a13','#640d18','#7a111e','#901625','#a51c2d','#b92536','#cc3140','#dc414c','#e9585c','#f37670','#fa9a8c','#ffc4b6'],
    ['#1a1203','#2a1d05','#3c2a07','#50380a','#64480d','#7a5911','#906b15','#a67e1a','#ba9120','#cca428','#dcb632','#e9c740','#f3d658','#fae47c','#fff2b0'],
    ['#04121f','#071c2e','#0a2a40','#0d3a52','#0f4a5e','#125a68','#18706f','#1f8a78','#2aa382','#3fbf8f','#5fd6a0','#8ae6b6','#b2f0cc','#d6f8e2','#f0fff4'],
    ['#0a0620','#120a34','#1a0f48','#24135c','#30186e','#3e1d80','#4f2490','#622c9e','#7835aa','#9040b4','#a94dbc','#c260c4','#d87ccc','#eaa0da','#f8c8ec'],
    ['#0c1240','#1a1a5a','#2a2070','#40287e','#5a2e86','#7a3486','#9c3c7e','#bc4872','#d65a66','#ea725a','#f58e52','#fbaa58','#ffc674','#ffdc9c','#fff0c8'],
    ['#020a24','#061636','#0a2248','#0e305c','#14406e','#1c5280','#266692','#327aa2','#4290b2','#56a6c0','#6ebccc','#8ad0d8','#a8e2e4','#c8f0f0','#e6fcfc']
  ].map(p => p.map(hexRGB));
  const SEG = 8;    // segundos que tarda en pasar de una paleta a la siguiente
  const N = PALS[0].length, HORIZON_IDX = 10.2, SKY = new Uint32Array(N);
  const setSky = t => {
    const pos = t / SEG, a = Math.floor(pos) % PALS.length, b = (a + 1) % PALS.length, fr = pos - Math.floor(pos);
    const e = fr * fr * (3 - 2 * fr);
    for (let i = 0; i < N; i++) SKY[i] = u32(mixRGB(PALS[a][i], PALS[b][i], e));
  };
  setSky(0);
  const STARC = ['#ffffff','#c9f7ee','#ffc0d6','#9fd8ff'].map(h => u32(hexRGB(h)));
  const STARD = ['#7f8fd0','#6fa8b8','#b07aa8','#5f8ad0'].map(h => u32(hexRGB(h)));
  const PARTC = ['#ffffff','#6fe3d0','#ff5fa2','#ffd166','#c9f7ee'].map(h => u32(hexRGB(h)));
  const LIT = hexRGB('#ffd6ec');
  let W = 0, H = 0, CELL = 4, img, buf, fg, fgLit, horizon = 0, base, sy, cy, sx, cx, w2;
  let stars = [], parts = [], ripples = [];
  let mx = -1e4, my = -1e4, gx = -1e4, gy = -1e4, lastDraw = 0, rz = null;
  const GR = 34, GR2 = GR * GR, LR = 22, LR2 = LR * LR;

  function build(){

        const tier = Math.min(tiers - 1, Math.floor(r / th)), inT = (r - tier * th) / th;
        const top = tier / tiers * maxW * .55, bot = (tier + 1) / tiers * maxW;
        const hw = Math.round(top + (bot - top) * inT), y = by - h + r;

          if (Math.abs(dx) === hw && hw > 1 && ((r + dx) & 1)) continue;

    };
    const back = ['#0d3b4a','#125257','#1a6a68','#2a8a80','#6fcfbf'].map(hexRGB);
    const front = ['#0f4a52','#17706c','#23968a','#4fc4b0','#a6f0e0','#e6fff8'].map(hexRGB);
    for (let x = -4; x < W + 6; x += 4 + Math.floor(R() * 7)) pine(x, groundY - 1, Math.round(H * (.08 + R() * .09)), back, false);

    // Suelo nevado con hierba
    const g = ['#e0f4ff','#a9d8ec','#2a9a5c','#1f7a4c','#145a3a'].map(hexRGB);

      for (let x = 0; x < W; x++) {

  }

  const spark = (x, y, n, spd) => {
    for (let i = 0; i < n && parts.length < 220; i++) {

function setPath(obj, path, val){

}
const DATA_KEYS = ['config', 'students', 'attendance', 'requests', 'tasks'];
const Store = {
  remote: CONFIG.FIREBASE_URL.replace(/\/+$/, ''),
  async load(){
    if (this.remote) {
      // Se cargan solo los datos ligeros; las imágenes (bc/photos) se piden aparte cuando hacen falta
      const parts = await Promise.all(DATA_KEYS.map(async k => {
        const r = await fetch(`${this.remote}/bc/${k}.json`, { cache:'no-store' });
        if (!r.ok) throw new Error('load');
        return [k, await r.json()];
      }));
      const out = {}; for (const [k, v] of parts) if (v !== null) out[k] = v;

    }

  },
  async get(path){
    if (this.remote) {
      const r = await fetch(`${this.remote}/bc/${path}.json`, { cache:'no-store' });
      if (!r.ok) throw new Error('get');
      return await r.json();
    }
    let o = {}; try { o = JSON.parse(kv.get('bc_db') || '{}'); } catch (e) {}
    for (const k of path.split('/')) { if (o == null || typeof o !== 'object') return null; o = o[k]; }
    return o ?? null;
  },
  async write(path, val){
    if (this.remote) {

        method: val === null ? 'DELETE' : 'PUT', headers:{ 'Content-Type':'application/json' },
        body: val === null ? undefined : JSON.stringify(val)
      });
      if (!r.ok) throw new Error('write');
      return;
    }
    let d = {}; try { d = JSON.parse(kv.get('bc_db') || '{}'); } catch (e) {}
    setPath(d, path, val); kv.set('bc_db', JSON.stringify(d));
  }
};

      <div class="row wrap"><button class="btn sm pk" data-act="mp3-pick">${file ? 'CAMBIAR MP3' : 'SUBIR MP3'}</button>

      ${!Store.remote && mu === MP3 && file === '' ? '<p class="warn">Tu MP3 está guardado en otro dispositivo. Súbelo aquí también para escucharlo.</p>' : ''}
      <p class="dim">${Store.remote ? 'Tu MP3 queda guardado en tu cuenta de la clase (máximo 8 MB) y sonará en cualquier dispositivo donde entres.' : 'Tu MP3 se queda guardado solo en este dispositivo.'}</p></div>
      <div class="remix"><button class="btn" data-act="remix">REMIX</button>
        <div class="col" style="gap:4px"><span class="h">${REMIXES[rx].n}</span><span class="dim">Pulsa para cambiar de remezcla (${rx + 1}/${REMIXES.length})</span></div>

/* ===== Panel del profesor ===== */
function renderTeacher(){
  app.innerHTML = `${modeBanner()}
  <header class="box top">
    <div class="who"><img class="px" src="${spriteURL('box')}" alt=""><span class="h">PANEL DEL PROFESOR</span></div>

}
function refreshTeacher(){
  const p = $('#panel'); if (!p || focusInside(p)) return;
  const td = todayStr(), list = sortedStudents();
  const spent = new Set(Object.values(db.requests).filter(r => r.date === td).map(r => r.sid)).size;
  const pend = Object.values(db.requests).filter(r => r.status !== 'entregado').length;
  const tb = (k, label) => `<button class="btn sm ${view.tab === k ? 'on' : 'gh'}" data-act="tab" data-arg="${k}">${label}</button>`;
  const body = view.tab === 'peticiones' ? tabPeticiones() : view.tab === 'clase' ? tabClase() : tabAsistencia();
  p.innerHTML = `<div class="tabs">${tb('asistencia', 'ASISTENCIA')}${tb('peticiones', `PETICIONES${pend ? `<span class="badge">${pend}</span>` : ''}`)}${tb('clase', 'CLASE')}</div>
    <div class="stats"><span>ALUMNOS <b>${list.length}</b></span><span>CUPONES GASTADOS HOY <b>${spent}</b></span><span>PENDIENTES <b>${pend}</b></span></div>${body}`;
  const c = $('#conn'); if (c) c.hidden = connected;
}
function tabAsistencia(){
  const d = view.date, at = db.attendance[d] || {}, list = sortedStudents(), present = list.filter(([id]) => at[id]).length;
  return `<div class="row between wrap"><label>Fecha<input type="date" id="att-date" value="${d}"></label><span class="h sm">PRESENTES ${present}/${list.length}</span></div>

    return `<div class="roll ${v ? 'on' : ''}"><img class="px avs" src="${avatarURL(lookOf(s))}" alt="">
      <div><b>${esc(s.name)}</b><div class="dim">Cupones: ${s.coupons || 0}/${MAX_COUPONS}</div></div>
      ${v ? `<div class="right"><span class="tag ok">${v === 'c' ? '+1 CUPÓN' : 'PRESENTE'}</span><button class="btn gh sm" data-act="undo" data-arg="${id}">DESHACER</button></div>`
          : `<button class="btn gr" data-act="present" data-arg="${id}">PRESENTE</button>`}</div>`;

}
function tabPeticiones(){

    const st = statusOf(r.status);
    return `<article class="req ${st.cls}">
      <div class="row between wrap"><b class="h sm">${esc(r.name)}</b><span class="tag">${esc(r.type)}</span></div>
      <p class="dim">${esc(longDate(r.date))} · ${new Date(r.ts).toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' })}</p>
      <p class="desc">${esc(r.desc)}</p>
      ${r.refs ? `<p class="dim">Referencias: ${esc(r.refs)}</p>` : ''}${r.goal ? `<p class="dim">Resultado esperado: ${esc(r.goal)}</p>` : ''}
      <div class="stat">${px(st.icon)}<div class="lbl">${st.label}</div></div>
      <div class="row wrap">${STATUS.slice(0, 4).map(s => `<button class="btn sm ${s.k === r.status ? 'on' : 'gh'}" data-act="status" data-arg="${id}" data-arg2="${s.k}">${s.label}</button>`).join('')}
        <button class="btn sm cy" data-act="copy" data-arg="${id}">COPIAR</button></div>

/* ===== Acciones ===== */
const handlers = {
  'login-mode': a => { view.login = a; renderLogin(); },
  logout,
  drawer: a => { view.drawer = view.drawer === a ? null : a; refreshStudent(); if (view.drawer) { const dr = $('#drawer'); dr && dr.scrollIntoView && dr.scrollIntoView({ behavior:REDUCE ? 'auto' : 'smooth', block:'nearest' }); } },
  close: () => { view.drawer = null; refreshStudent(); },
  'cal-prev': () => { const c = view.cal; c.m--; if (c.m < 0) { c.m = 11; c.y--; } renderCalendar(); },
  'cal-next': () => { const c = view.cal; c.m++; if (c.m > 11) { c.m = 0; c.y++; } renderCalendar(); },
  'cal-toggle': () => { view.calOpen = !view.calOpen; renderCalendar(); },
  day: a => { view.sel = a; renderCalendar(); },
  look: (k, v) => { const L = lookOf(db.students[session.id]); L[k] = (k === 'hs' || k === 'sd') ? v : +v; put(`students/${session.id}/look`, lookOf({ look:L })); },
  'look-rand': () => put(`students/${session.id}/look`, randomLook()),
  preset: a => { const p = PRESETS[+a]; if (p) put(`students/${session.id}/look`, { ...p }); },
  bg: a => put(`students/${session.id}/bg`, a),
  music: a => { const m = +a; put(`students/${session.id}/music`, m); Music.play(m, remixOf(db.students[session.id])).then(() => { if (view.drawer === 'fondo') renderDrawer(); }); },
  remix: () => {
    const me = db.students[session.id], r = (remixOf(me) + 1) % REMIXES.length;
    Music.init(); Music.setRemix(r); put(`students/${session.id}/remix`, r);
    toast(Music.mode ? `Remix: ${REMIXES[r].n}` : `Remix: ${REMIXES[r].n}. Elige una música para oírlo.`);
  },
  'mp3-pick': () => { const i = $('#mp3-in'); if (i) { i.value = ''; i.click(); } },
  'mp3-del': async () => {
    if (Store.remote) {
      try { await Store.write(`mp3/${session.id}`, null); await put(`students/${session.id}/mp3`, null); }
      catch (e) { toast('No se pudo borrar. Revisa la conexión.', 'err'); return; }
    }
    await LocalFiles.del('mp3_' + session.id); mp3Info[session.id] = ''; Music.buf = null; Music.bufKey = '';
    if (musicOf(db.students[session.id]) === MP3) { Music.stop(); await put(`students/${session.id}/music`, -1); }
    renderDrawer(); toast('MP3 borrado.');
  },
  'photo-pick': () => { const i = $('#photo-in'); if (i) { i.value = ''; i.click(); } },
  'photo-del': async () => {
    try { await Store.write(`photos/${session.id}`, null); photos[session.id] = ''; onPhotos(); toast('Cuadro vacío.'); }
    catch (e) { toast('No se pudo guardar. Revisa la conexión.', 'err'); }
  },
  'photo-mod': async id => {
    try { await Store.write(`photos/${id}`, null); photos[id] = ''; refreshTeacher(); toast('Imagen retirada.'); }
    catch (e) { toast('No se pudo guardar. Revisa la conexión.', 'err'); }
  },
  tab: a => { view.tab = a; refreshTeacher(); },
  voice: () => speak('Prueba de voz. El alumno de ejemplo ha recibido un cupón'),
  present: async id => {
    const st = db.students[id]; if (!st) return;
    const d = view.date; if (db.attendance[d] && db.attendance[d][id]) return;
    const grant = d === todayStr() && (st.coupons || 0) < MAX_COUPONS;
    if (grant) speak(`El alumno ${st.name} ha recibido un cupón`);
    else if (d === todayStr()) toast(`${st.name} ya tiene el máximo de cupones (${MAX_COUPONS}). Asistencia marcada sin cupón.`);
    const coupons = (st.coupons || 0) + 1;
    await put(`attendance/${d}/${id}`, grant ? 'c' : 'n');
    if (grant) await put(`students/${id}/coupons`, coupons);
  },
  undo: async id => {
    const d = view.date, v = db.attendance[d] && db.attendance[d][id]; if (!v) return;
    await put(`attendance/${d}/${id}`, null);
    if (v === 'c' && db.students[id]) await put(`students/${id}/coupons`, Math.max(0, (db.students[id].coupons || 0) - 1));
  },
  status: (id, k) => put(`requests/${id}/status`, k),
  deliver: async id => {
    const inp = $('#url-' + id), url = inp ? inp.value.trim() : '';
    if (url && !safeUrl(url)) { toast('El enlace debe empezar por http:// o https://', 'err'); return; }
    await put(`requests/${id}/url`, url || null);
    await put(`requests/${id}/status`, 'entregado');
    toast('Marcada como entregada.');
  },
  copy: id => {
    const r = db.requests[id]; if (!r) return;
    const text = `Tipo: ${r.type}\nAlumno: ${r.name}\nDescripción: ${r.desc}\nReferencias: ${r.refs || '-'}\nResultado esperado: ${r.goal || '-'}`;
    try { navigator.clipboard.writeText(text).then(() => toast('Petición copiada.'), () => toast('No se pudo copiar.', 'err')); } catch (e) { toast('No se pudo copiar.', 'err'); }
  },
  coupon: async (id, n) => { const s = db.students[id]; if (!s) return; await put(`students/${id}/coupons`, Math.max(0, Math.min(MAX_COUPONS, (s.coupons || 0) + (+n)))); },
  delstudent: async id => {
    if (view.confirmDel !== id) { view.confirmDel = id; refreshTeacher(); return; }
    view.confirmDel = null; await put(`students/${id}`, null);
    try { await Store.write(`photos/${id}`, null); delete photos[id]; await Store.write(`mp3/${id}`, null); } catch (e) {}
  }
};
const forms = {
  'login-student': f => {
    const q = norm(new FormData(f).get('name')); if (!q) return;
    const list = Object.entries(db.students);
    let hit = list.filter(([, s]) => norm(s.name) === q);
    if (hit.length !== 1) hit = list.filter(([, s]) => norm(s.name).split(' ')[0] === q);
    if (!list.length) { loginMsg('Todavía no hay alumnos. Pide al profesor que pase la lista.'); return; }
    if (hit.length !== 1) { loginMsg(hit.length > 1 ? 'Hay varios alumnos con ese nombre. Escribe también tu apellido.' : 'No encuentro ese nombre. Escríbelo como lo apuntó el profesor.'); return; }
    session = { role:'student', id:hit[0][0] }; kv.set('bc_session', JSON.stringify(session)); view.drawer = null;
    mount(); applyMusic(); studentLoaded();
  },
  'login-teacher': async f => {
    const code = String(new FormData(f).get('code') || ''); if (code.length < 4) { loginMsg('Mínimo 4 caracteres.'); return; }
    const h = await hashCode(code);
    if (!db.config.code) { await put('config/code', h); }
    else if (db.config.code !== h) { loginMsg('Código incorrecto.'); return; }
    session = { role:'teacher' }; kv.set('bc_session', JSON.stringify(session)); mount();
  },
  request: async f => {
    try { db = normalize(await Store.load()); } catch (e) {}
    const cur = db.students[session.id];
    if (!cur || (cur.coupons || 0) < 1) { toast('No tienes cupones.', 'err'); refreshStudent(); return; }
    const d = new FormData(f), desc = String(d.get('desc') || '').trim();
    if (desc.length < 10) { toast('Cuéntalo con un poco más de detalle (mínimo 10 letras).', 'err'); return; }
    const id = uid('r_');
    await put(`students/${session.id}/coupons`, cur.coupons - 1);
    await put(`requests/${id}`, { sid:session.id, name:cur.name, type:String(d.get('type')), desc, refs:String(d.get('refs') || '').trim(), goal:String(d.get('goal') || '').trim(), status:'enviado', ts:Date.now(), date:todayStr() });
    view.drawer = 'buzon'; refreshStudent(); toast('¡Cupón gastado! Tu petición está en el buzón.');
  },
  'add-students': async f => {
    const names = String(new FormData(f).get('names') || '').split('\n').map(s => s.trim()).filter(Boolean);
    if (!names.length) return;
    let n = Object.keys(db.students).length;
    for (const name of names) {
      if (Object.values(db.students).some(s => norm(s.name) === norm(name))) continue;
      await put(`students/${uid('s_')}`, { name:name.slice(0, 40), avatar:n % PRESETS.length, coupons:0, bg:'noche', music:-1 }); n++;
    }
    view.tab = 'clase'; refreshTeacher(); toast('Alumnos añadidos.');
  },
  task: async f => {
    const d = new FormData(f), date = String(d.get('date') || view.date), text = String(d.get('text') || '').trim();
    await put(`tasks/${date}`, text || null); toast('Tareas guardadas.');
  },
  'set-code': async f => {
    const code = String(new FormData(f).get('code') || ''); if (code.length < 4) return;
    await put('config/code', await hashCode(code)); f.reset(); toast('Código cambiado.');
  }
};
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const h = handlers[el.dataset.act]; if (h) h(el.dataset.arg, el.dataset.arg2, el);
});
app.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  const h = forms[f.dataset.form]; if (h) h(f);
});
app.addEventListener('change', e => {
  if (e.target.id === 'att-date') { view.date = e.target.value || todayStr(); refreshTeacher(); }
  if (e.target.name === 'date' && e.target.closest('[data-form="task"]')) {
    view.date = e.target.value || todayStr(); const t = $('#task-text'); if (t) t.value = db.tasks[view.date] || '';
  }
});

function studentLoaded(){
  if (!session || session.role !== 'student') return;
  loadPhoto(session.id, true); loadMp3Info(session.id);
}
$('#photo-in').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0]; if (!file || !session || session.role !== 'student') return;
  if (file.size > 30 * 1024 * 1024) { toast('La imagen es demasiado grande.', 'err'); return; }
  let data;
  try { data = await photoToJpeg(file); } catch (err) { toast('No se pudo leer esa imagen. Prueba con una JPG o PNG.', 'err'); return; }
  try { await Store.write(`photos/${session.id}`, data); } catch (err) { toast('No se pudo guardar. Revisa la conexión.', 'err'); return; }
  photos[session.id] = data; view.drawer = 'cuadro'; onPhotos(); refreshStudent(); toast('¡Cuadro colgado en tu habitación!');
});
$('#mp3-in').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0]; if (!file || !session || session.role !== 'student') return;
  if (!/\.mp3$/i.test(file.name) && !/audio\/(mpeg|mp3)/i.test(file.type)) { toast('El archivo tiene que ser .mp3', 'err'); return; }
  const max = Store.remote ? MP3_MAX : 30 * 1024 * 1024;
  if (file.size > max) { toast(`El MP3 es demasiado grande (máximo ${max / 1048576} MB).`, 'err'); return; }
  if (!Music.init()) { toast('Este navegador no puede reproducir audio.', 'err'); return; }
  let buf;
  try { buf = await Music.ctx.decodeAudioData(await file.arrayBuffer()); } catch (err) { toast('No se pudo leer ese MP3.', 'err'); return; }
  const sid = session.id, rec = { blob:file, name:file.name.slice(0, 80), size:file.size, id:uid('m_') };
  if (Store.remote) {
    try {
      const b64 = await blobToB64(file), n = Math.ceil(b64.length / MP3_CHUNK);
      await Store.write(`mp3/${sid}`, null);
      for (let i = 0; i < n; i++) { toast(`Subiendo tu música... ${Math.round(i / n * 100)}%`); await Store.write(`mp3/${sid}/${i}`, b64.slice(i * MP3_CHUNK, (i + 1) * MP3_CHUNK)); }
      await LocalFiles.set('mp3_' + sid, rec);
      await put(`students/${sid}/mp3`, { id:rec.id, name:rec.name, size:rec.size, n });
    } catch (err) { toast('No se pudo subir la música. Revisa la conexión.', 'err'); return; }
  } else await LocalFiles.set('mp3_' + sid, rec);
  Music.buf = buf; Music.bufKey = 'mp3_' + sid + '|' + rec.id;
  mp3Info[session.id] = rec.name;
  await put(`students/${session.id}/music`, MP3);
  await Music.play(MP3, remixOf(db.students[session.id]));
  view.drawer = 'fondo'; renderDrawer(); toast('¡Tu canción ya suena en bucle!');
});

/* ===== Arranque ===== */
(async function boot(){
  app.innerHTML = '<p class="h center" style="margin-top:40px">CONECTANDO...</p>';
  await poll(true);
  mount(); studentLoaded();
  setInterval(() => { if (!document.hidden) poll(); }, 4000);
})();
})();
</script>
